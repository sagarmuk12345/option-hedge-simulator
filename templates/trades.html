<!DOCTYPE html>
<html>
<head>
    <title>Trades</title>
</head>
<body>

<h1>Option Hedge Simulator</h1>

<a href="/">Dashboard</a> |
<a href="/portfolio">Portfolio</a> |
<a href="/trades">Trades</a> |
<a href="/scenario">Scenario</a> |
<a href="/heatmap">Heat Map</a>

<hr>

<h2>Add Trade</h2>

<form method="POST">

<label>Symbol:</label>
<input type="text" name="symbol" required>

<br><br>

<label>Asset Type:</label>
<select name="asset_type">
    <option>Stock</option>
    <option>Call</option>
    <option>Put</option>
</select>

<br><br>

<label>Side:</label>
<select name="side">
    <option>Buy</option>
    <option>Sell</option>
</select>

<br><br>

<label>Quantity:</label>
<input type="number" name="quantity">

<br><br>

<label>Price:</label>
<input type="number" step="0.01" name="price">

<br><br>

<label>Strike:</label>
<input type="number" step="0.01" name="strike">

<br><br>

<label>Expiry:</label>
<input type="date" name="expiry">

<br><br>

<button type="submit">
Save Trade
</button>

</form>

<hr>

<h2>Saved Trades</h2>

{% for trade in trades %}

<div style="border:1px solid black;padding:10px;margin-bottom:10px;">

<strong>{{ trade[0] }}</strong>

<br>

{{ trade[2] }}
{{ trade[3] }}
{{ trade[1] }}

<br>

Price: {{ trade[4] }}

<br>

Strike: {{ trade[5] }}

<br>

Expiry: {{ trade[6] }}

</div>

{% endfor %}

</body>
</html>
